<!doctype html>
<html lang="{{ .Lang }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body id="top" data-search-index="{{ "index.json" | relLangURL }}" data-copy-label="{{ i18n "copy" }}" data-copied-label="{{ i18n "copied" }}">
    <a class="skip" href="#main">{{ i18n "skip" }}</a>
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "search.html" . }}
  </body>
</html>
