{{ define "main" }}
<section class="about-page">
  <div class="wrap about-page-grid">
    <div>
      <h1>{{ .Title }}</h1>
      <p class="dek">{{ .Description }}</p>
    </div>
    <figure class="portrait">
      {{ partial "responsive-image.html" (dict "src" site.Params.aboutPortrait "crop" site.Params.aboutPortraitCrop "alt" site.Params.author "loading" "eager" "sizes" "(max-width: 980px) 90vw, 40vw") }}
    </figure>
  </div>
</section>

<section class="about-body">
  <div class="wrap about-content">
    {{ partial "content.html" . }}
  </div>
</section>
{{ end }}
