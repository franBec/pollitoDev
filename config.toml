baseURL = "https://pollito.dev/"
title = "Pollito Dev"
enableRobotsTXT = true
titleCaseStyle = "none"
capitalizeListTitles = false
pluralizeListTitles = false

DefaultContentLanguage = "en"
DefaultContentLanguageInSubdir = true
locale = "en"

[pagination]
  pagerSize = 6

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/uploads"
    target = "assets/uploads"

[taxonomies]
  category = "categories"

[languages]
  [languages.en]
    contentDir = "content/en"
    weight = 1
    label = "English"
    title = "Pollito Dev"
    [languages.en.params]
      description = "Software notes from Lisbon: Java, Spring Boot, cloud systems, AI tooling, and the things I build after hours."
      tagline = "Software developer in Lisbon. I write about Java, cloud, AI tooling, and the things I build after hours."
      role = "Currently building AI code-analysis tools at Devsu."
      ogTagline = "Software notes from Lisbon."

    [[languages.en.menu.main]]
      name = "Writing"
      url = "blog/"
      weight = 1

    [[languages.en.menu.main]]
      name = "Topics"
      url = "categories/"
      weight = 2

    [[languages.en.menu.main]]
      name = "About"
      url = "page/about/"
      weight = 3

  [languages.es]
    contentDir = "content/es"
    weight = 2
    label = "Español"
    title = "Pollito Dev"
    [languages.es.params]
      description = "Notas de software desde Lisboa: Java, Spring Boot, sistemas cloud, herramientas de IA y lo que construyo después del trabajo."
      tagline = "Desarrollador de software en Lisboa. Escribo sobre Java, cloud, herramientas de IA y lo que construyo después del trabajo."
      role = "Actualmente construyendo herramientas de análisis de código con IA en Devsu."
      ogTagline = "Notas de software desde Lisboa."

    [[languages.es.menu.main]]
      name = "Escritura"
      url = "blog/"
      weight = 1

    [[languages.es.menu.main]]
      name = "Temas"
      url = "categories/"
      weight = 2

    [[languages.es.menu.main]]
      name = "Acerca de mí"
      url = "page/about/"
      weight = 3

[params]
  author = "Franco Becvort"
  github = "https://github.com/franBec"
  linkedin = "https://www.linkedin.com/in/franco-becvort/"
  favicon = "/favicon.ico"
  heroPortrait = "images/portrait-bamboo.jpg"
  aboutPortrait = "images/portrait-websummit.jpg"
  aboutSecondary = "images/portrait-sunset.jpg"
  aboutDuck = "images/portrait-duck.jpg"
  lisbonImage = "images/lisbon-bridge.jpg"
  ogBackground = "images/og-background.png"
  ogFont = "fonts/bricolage-grotesque-800.ttf"
  description = "Software notes from Lisbon."

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "github"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = false
