baseURL = "https://pollito.dev/"
title = "Pollito Dev"
enableRobotsTXT = true
titleCaseStyle = "none"
capitalizeListTitles = false
pluralizeListTitles = false

DefaultContentLanguage = "en"
DefaultContentLanguageInSubdir = true
locale = "en"

[pagination]
  pagerSize = 6

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/uploads"
    target = "assets/uploads"

[taxonomies]
  category = "categories"

[languages]
  [languages.en]
    contentDir = "content/en"
    weight = 1
    label = "English"
    title = "Pollito Dev"
    [languages.en.params]
      description = "Notes on Java, Spring Boot, cloud systems, application security, and AI tooling."
      tagline = "Backend engineer writing about Java, cloud, application security, and AI tooling."
      role = "At Devsu, building banking and fintech platforms."
      ogTagline = "Software notes on Java, cloud, and security."

    [[languages.en.menu.main]]
      name = "Writing"
      url = "blog/"
      weight = 1

    [[languages.en.menu.main]]
      name = "Topics"
      url = "categories/"
      weight = 2

    [[languages.en.menu.main]]
      name = "About"
      url = "page/about/"
      weight = 3

  [languages.es]
    contentDir = "content/es"
    weight = 2
    label = "Español"
    title = "Pollito Dev"
    [languages.es.params]
      description = "Notas sobre Java, Spring Boot, sistemas cloud, seguridad de aplicaciones y herramientas de IA."
      tagline = "Ingeniero backend. Escribo sobre Java, cloud, seguridad de aplicaciones y herramientas de IA."
      role = "En Devsu, construyendo plataformas bancarias y fintech."
      ogTagline = "Notas de software sobre Java, cloud y seguridad."

    [[languages.es.menu.main]]
      name = "Escritura"
      url = "blog/"
      weight = 1

    [[languages.es.menu.main]]
      name = "Temas"
      url = "categories/"
      weight = 2

    [[languages.es.menu.main]]
      name = "Acerca de mí"
      url = "page/about/"
      weight = 3

[params]
  author = "Franco Becvort"
  github = "https://github.com/franBec"
  linkedin = "https://www.linkedin.com/in/franco-becvort/"
  favicon = "/favicon.ico"
  heroPortrait = "images/portrait-bamboo-face.jpg"
  aboutPortrait = "images/portrait-websummit-face.jpg"
  ogBackground = "images/og-background.png"
  ogFont = "fonts/bricolage-grotesque-800.ttf"
  description = "Software notes on Java, cloud, and security."

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "github"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = false
